name: Build YouHost

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: youhost-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  macos:
    name: macOS universal
    # macos-latest and macos-15 are arm64. That pool has been refusing jobs
    # ("not acquired by Runner of type hosted") before any step runs.
    # macos-15-intel is a different pool and still cross-builds the universal
    # arm64 + x86_64 binary. A push retriggers the job; this token cannot rerun.
    runs-on: macos-15-intel
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Engine tests
        run: |
          set -euo pipefail
          cmake --build build --config Release --target YouHostTests
          TEST=build/YouHostTests
          if [ ! -x "${TEST}" ]; then
            echo "YouHostTests was not produced"
            find build -name 'YouHostTests*' -print
            exit 1
          fi
          "${TEST}"

      - name: SYNC LOST glyphs
        run: |
          set -euo pipefail
          cmake --build build --config Release --target YouHostSyncLostGlyphs
          TEST=build/YouHostSyncLostGlyphs
          if [ ! -x "${TEST}" ]; then
            echo "YouHostSyncLostGlyphs was not produced"
            find build -name 'YouHostSyncLostGlyphs*' -print
            exit 1
          fi
          "${TEST}"

      - name: Tool window keys
        run: |
          set -euo pipefail
          cmake --build build --config Release --target YouHostToolKeys
          TEST=build/YouHostToolKeys
          if [ ! -x "${TEST}" ]; then
            echo "YouHostToolKeys was not produced"
            find build -name 'YouHostToolKeys*' -print
            exit 1
          fi
          "${TEST}"

      - name: AUDelay silent input
        run: |
          set -euo pipefail
          cmake --build build --config Release --target YouHostAuDelayTest
          TEST=build/YouHostAuDelayTest
          if [ ! -x "${TEST}" ]; then
            echo "YouHostAuDelayTest was not produced"
            find build -name 'YouHostAuDelayTest*' -print
            exit 1
          fi
          "${TEST}"

      - name: Apple AU chain offline
        run: |
          set -euo pipefail
          cmake --build build --config Release --target YouHostAuChainTest
          TEST=build/YouHostAuChainTest
          if [ ! -x "${TEST}" ]; then
            echo "YouHostAuChainTest was not produced"
            find build -name 'YouHostAuChainTest*' -print
            exit 1
          fi
          "${TEST}"

      - name: Group edit stress
        run: |
          set -euo pipefail
          cmake --build build --config Release --target YouHostGroupStressTest
          TEST=build/YouHostGroupStressTest
          if [ ! -x "${TEST}" ]; then
            echo "YouHostGroupStressTest was not produced"
            find build -name 'YouHostGroupStressTest*' -print
            exit 1
          fi
          "${TEST}"

      - name: Mono 1/1 null
        run: |
          set -euo pipefail
          cmake --build build --config Release --target YouHostMonoNullTest
          TEST=build/YouHostMonoNullTest
          if [ ! -x "${TEST}" ]; then
            echo "YouHostMonoNullTest was not produced"
            find build -name 'YouHostMonoNullTest*' -print
            exit 1
          fi
          "${TEST}"

      - name: Ad-hoc sign
        run: |
          set -euo pipefail
          APP=$(find build -type d -name 'YouHost.app' -print -quit)
          if [ -z "${APP}" ]; then
            echo "YouHost.app was not produced"
            find build -name 'YouHost*' -print
            exit 1
          fi
          echo "Signing ${APP}"
          codesign --force --sign - --timestamp=none "${APP}"
          codesign --verify --strict --verbose=2 "${APP}"
          codesign -dv "${APP}" 2>&1 | tee "${RUNNER_TEMP}/codesign.txt"
          grep -q "Signature=adhoc" "${RUNNER_TEMP}/codesign.txt"
          FLAGS=$(sed -n 's/.*flags=\([^ ]*\).*/\1/p' "${RUNNER_TEMP}/codesign.txt" | head -n 1)
          echo "codesign flags: ${FLAGS}"
          if printf '%s\n' "${FLAGS}" | grep -q 'runtime'; then
            echo "Hardened runtime must stay off for unsigned plugin loading."
            exit 1
          fi
          BIN="${APP}/Contents/MacOS/YouHost"
          lipo -info "${BIN}" | tee "${RUNNER_TEMP}/lipo.txt"
          grep -q 'arm64' "${RUNNER_TEMP}/lipo.txt"
          grep -q 'x86_64' "${RUNNER_TEMP}/lipo.txt"
          plutil -p "${APP}/Contents/Info.plist" | tee "${RUNNER_TEMP}/plist.txt"
          grep -q 'NSMicrophoneUsageDescription' "${RUNNER_TEMP}/plist.txt"
          grep -q 'YouHost' "${RUNNER_TEMP}/plist.txt"

      - name: Zip
        run: |
          set -euo pipefail
          APP=$(find build -type d -name 'YouHost.app' -print -quit)
          if [ -z "${APP}" ]; then
            echo "YouHost.app was not produced"
            exit 1
          fi
          rm -rf pack
          mkdir -p pack
          ditto "${APP}" "pack/YouHost.app"
          cp "INSTALL.md" "pack/ASENNUSOHJE - INSTALL.txt"
          VERSION=$(awk '/^project\(YouHost/,/^\)/' CMakeLists.txt | sed -n 's/^[[:space:]]*VERSION[[:space:]]\([0-9][0-9.]*\).*/\1/p' | head -n 1)
          if [ -z "${VERSION}" ]; then
            echo "project VERSION was not found in CMakeLists.txt"
            exit 1
          fi
          ZIP="YouHost-${VERSION}-macOS.zip"
          echo "YOUHOST_ZIP=${ZIP}" >> "${GITHUB_ENV}"
          echo "YOUHOST_RELEASE_NAME=YouHost ${VERSION}" >> "${GITHUB_ENV}"
          rm -f "${ZIP}"
          # --keepParent puts YouHost.app at the zip root. zip -g adds the notes beside it.
          ditto -c -k --keepParent "pack/YouHost.app" "${ZIP}"
          (cd pack && zip -g "../${ZIP}" "ASENNUSOHJE - INSTALL.txt")
          unzip -t "${ZIP}"
          ZIP="${ZIP}" python3 - <<'PY'
          import os, zipfile
          archive = os.environ["ZIP"]
          names = zipfile.ZipFile(archive).namelist()
          notes = [n for n in names if n.rstrip("/") == "ASENNUSOHJE - INSTALL.txt"]
          if notes != ["ASENNUSOHJE - INSTALL.txt"]:
              raise SystemExit("install notes are not beside YouHost.app: " + repr(notes))
          if not any(n.startswith("YouHost.app/") for n in names):
              raise SystemExit("YouHost.app is missing from the zip")
          if any(n.startswith("YouHost.app/") and "ASENNUSOHJE" in n for n in names):
              raise SystemExit("install notes were packed inside the app")
          print("zip layout ok", archive)
          PY
          ls -lh "${ZIP}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: YouHost-macOS-universal
          path: pack
          if-no-files-found: error

      - name: Attach zip to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ env.YOUHOST_RELEASE_NAME }}
          files: ${{ env.YOUHOST_ZIP }}
          prerelease: true
          make_latest: false
          body: |
            2026-10-20

            YouHost 1.0.3 is a prerelease for testing. It is not the Latest release.

            - Sidechain plugins, including FabFilter Pro-C and Pro-Q, keep the stereo main bus they opened with, including on a mono channel. The sidechain stays on and is fed silence. Audio keeps running.
            - A plugin editor opens only after that plugin's load has finished, so opening the editor cannot freeze the app.
            - A slow plugin load still stays off the audio thread.
            - Help is in English, in a window you can scroll. The ? tooltip is one short line.
            - Stereo link works for a neighbouring pair when both channels are in the same group, or both are ungrouped. Folding a group does not change the sound.
            - Audio Units with a sidechain, including FabFilter Pro-Q, Pro-C, Pro-G, Pro-MB, Pro-DS, Pro-L 2, The Glue, and soothe, stay loaded. If a plugin still will not open, youhost.log says why.
            - The device list at startup no longer opens every audio card just to count its channels.
            - Sitting idle is no longer written to youhost.log as a stall.
            - A sample-rate mismatch shows a red line, for example "Sample rate mismatch: session 48 kHz, audio device 44.1 kHz". youhost.log records it. Audio and recording keep going.
            - New, Open, Save, and Save As are unchanged, and a 1.0.1 session still opens. The session format stays 7.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
