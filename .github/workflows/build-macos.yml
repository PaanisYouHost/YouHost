name: Build YouHost

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: youhost-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  macos:
    name: macOS universal
    # macos-latest and macos-15 are arm64. That pool has been refusing jobs
    # ("not acquired by Runner of type hosted") before any step runs.
    # macos-15-intel is a different pool and still cross-builds the universal
    # arm64 + x86_64 binary. A push retriggers the job; this token cannot rerun.
    runs-on: macos-15-intel
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Engine tests
        run: |
          set -euo pipefail
          cmake --build build --config Release --target YouHostTests
          TEST=build/YouHostTests
          if [ ! -x "${TEST}" ]; then
            echo "YouHostTests was not produced"
            find build -name 'YouHostTests*' -print
            exit 1
          fi
          "${TEST}"

      - name: SYNC LOST glyphs
        run: |
          set -euo pipefail
          cmake --build build --config Release --target YouHostSyncLostGlyphs
          TEST=build/YouHostSyncLostGlyphs
          if [ ! -x "${TEST}" ]; then
            echo "YouHostSyncLostGlyphs was not produced"
            find build -name 'YouHostSyncLostGlyphs*' -print
            exit 1
          fi
          "${TEST}"

      - name: Tool window keys
        run: |
          set -euo pipefail
          cmake --build build --config Release --target YouHostToolKeys
          TEST=build/YouHostToolKeys
          if [ ! -x "${TEST}" ]; then
            echo "YouHostToolKeys was not produced"
            find build -name 'YouHostToolKeys*' -print
            exit 1
          fi
          "${TEST}"

      - name: AUDelay silent input
        run: |
          set -euo pipefail
          cmake --build build --config Release --target YouHostAuDelayTest
          TEST=build/YouHostAuDelayTest
          if [ ! -x "${TEST}" ]; then
            echo "YouHostAuDelayTest was not produced"
            find build -name 'YouHostAuDelayTest*' -print
            exit 1
          fi
          "${TEST}"

      - name: Apple AU chain offline
        run: |
          set -euo pipefail
          cmake --build build --config Release --target YouHostAuChainTest
          TEST=build/YouHostAuChainTest
          if [ ! -x "${TEST}" ]; then
            echo "YouHostAuChainTest was not produced"
            find build -name 'YouHostAuChainTest*' -print
            exit 1
          fi
          "${TEST}"

      - name: Group edit stress
        run: |
          set -euo pipefail
          cmake --build build --config Release --target YouHostGroupStressTest
          TEST=build/YouHostGroupStressTest
          if [ ! -x "${TEST}" ]; then
            echo "YouHostGroupStressTest was not produced"
            find build -name 'YouHostGroupStressTest*' -print
            exit 1
          fi
          "${TEST}"

      - name: Mono 1/1 null
        run: |
          set -euo pipefail
          cmake --build build --config Release --target YouHostMonoNullTest
          TEST=build/YouHostMonoNullTest
          if [ ! -x "${TEST}" ]; then
            echo "YouHostMonoNullTest was not produced"
            find build -name 'YouHostMonoNullTest*' -print
            exit 1
          fi
          "${TEST}"

      - name: VST3 and AU stress
        run: |
          set -euo pipefail
          cmake --build build --config Release --target YouHostVst3Stress
          TEST=build/YouHostVst3Stress
          if [ ! -x "${TEST}" ]; then
            echo "YouHostVst3Stress was not produced"
            find build -name 'YouHostVst3Stress*' -print
            exit 1
          fi
          "${TEST}"

      - name: Ad-hoc sign
        run: |
          set -euo pipefail
          APP=$(find build -type d -name 'YouHost.app' -print -quit)
          if [ -z "${APP}" ]; then
            echo "YouHost.app was not produced"
            find build -name 'YouHost*' -print
            exit 1
          fi
          echo "Signing ${APP}"
          codesign --force --sign - --timestamp=none "${APP}"
          codesign --verify --strict --verbose=2 "${APP}"
          codesign -dv "${APP}" 2>&1 | tee "${RUNNER_TEMP}/codesign.txt"
          grep -q "Signature=adhoc" "${RUNNER_TEMP}/codesign.txt"
          FLAGS=$(sed -n 's/.*flags=\([^ ]*\).*/\1/p' "${RUNNER_TEMP}/codesign.txt" | head -n 1)
          echo "codesign flags: ${FLAGS}"
          if printf '%s\n' "${FLAGS}" | grep -q 'runtime'; then
            echo "Hardened runtime must stay off for unsigned plugin loading."
            exit 1
          fi
          BIN="${APP}/Contents/MacOS/YouHost"
          lipo -info "${BIN}" | tee "${RUNNER_TEMP}/lipo.txt"
          grep -q 'arm64' "${RUNNER_TEMP}/lipo.txt"
          grep -q 'x86_64' "${RUNNER_TEMP}/lipo.txt"
          plutil -p "${APP}/Contents/Info.plist" | tee "${RUNNER_TEMP}/plist.txt"
          grep -q 'NSMicrophoneUsageDescription' "${RUNNER_TEMP}/plist.txt"
          grep -q 'YouHost' "${RUNNER_TEMP}/plist.txt"

      - name: Zip
        run: |
          set -euo pipefail
          APP=$(find build -type d -name 'YouHost.app' -print -quit)
          if [ -z "${APP}" ]; then
            echo "YouHost.app was not produced"
            exit 1
          fi
          rm -rf pack
          mkdir -p pack
          ditto "${APP}" "pack/YouHost.app"
          cp "INSTALL.md" "pack/ASENNUSOHJE - INSTALL.txt"
          VERSION=$(awk '/^project\(YouHost/,/^\)/' CMakeLists.txt | sed -n 's/^[[:space:]]*VERSION[[:space:]]\([0-9][0-9.]*\).*/\1/p' | head -n 1)
          if [ -z "${VERSION}" ]; then
            echo "project VERSION was not found in CMakeLists.txt"
            exit 1
          fi
          ZIP="YouHost-${VERSION}-macOS.zip"
          echo "YOUHOST_ZIP=${ZIP}" >> "${GITHUB_ENV}"
          echo "YOUHOST_RELEASE_NAME=YouHost ${VERSION}" >> "${GITHUB_ENV}"
          rm -f "${ZIP}"
          # --keepParent puts YouHost.app at the zip root. zip -g adds the notes beside it.
          ditto -c -k --keepParent "pack/YouHost.app" "${ZIP}"
          (cd pack && zip -g "../${ZIP}" "ASENNUSOHJE - INSTALL.txt")
          unzip -t "${ZIP}"
          ZIP="${ZIP}" python3 - <<'PY'
          import os, zipfile
          archive = os.environ["ZIP"]
          names = zipfile.ZipFile(archive).namelist()
          notes = [n for n in names if n.rstrip("/") == "ASENNUSOHJE - INSTALL.txt"]
          if notes != ["ASENNUSOHJE - INSTALL.txt"]:
              raise SystemExit("install notes are not beside YouHost.app: " + repr(notes))
          if not any(n.startswith("YouHost.app/") for n in names):
              raise SystemExit("YouHost.app is missing from the zip")
          if any(n.startswith("YouHost.app/") and "ASENNUSOHJE" in n for n in names):
              raise SystemExit("install notes were packed inside the app")
          print("zip layout ok", archive)
          PY
          ls -lh "${ZIP}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: YouHost-macOS-universal
          path: pack
          if-no-files-found: error

      - name: Attach zip to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ env.YOUHOST_RELEASE_NAME }}
          files: |
            ${{ env.YOUHOST_ZIP }}
            YouHost-1.0.18-muutokset.txt
          prerelease: false
          make_latest: false
          body: |
            2026-11-05

            YouHost 1.0.18

            Fixes
            - A quit the user did not request is logged and refused. The close button, the Quit menu, and Command-Q still quit.
            - Plugin editors open on the message thread. An Audio Unit view that arrives on another thread is attached on the message thread.
            - The scanner separates timeouts from crashes, scans one plugin per process, and retries once before a blacklist. A timeout is not blacklisted.
            - The plugin list and the audio-card open run off the message thread.
            - A callback whose length does not match the configured buffer is not counted as a dropout.
            - Plugin protected mode added. Only a plugin that crashes or quits runs in a helper, with 32 samples of extra latency on that channel.
            - A protected-plugin crash mutes that channel, does not pass unprocessed audio, restarts the plugin, and fades the audio back in. OK only closes the notice.
            - Plugin state is snapshotted off the audio thread a few seconds after parameter changes.
            - Notices added: PLUGIN CRASHED, PLUGIN RESTORED, PLUGIN NOT RESTORED, and PLUGIN PROTECTED.
            - Session files stay format 7. Open session without this plugin still leaves a crashed plugin out of this launch.

            Korjaukset
            - Lopetus, jota käyttäjä ei pyytänyt, kirjataan ja estetään.
            - Plugin-ikkunat avataan viestisäikeellä.
            - Skanneri erottaa aikakatkaisun kaatumisesta ja yrittää kerran uudelleen ennen estolistaa.
            - Pluginlista ja äänikortin avaus tehdään pois pääsäikeeltä.
            - Väärä puskuripituus ei ole dropout.
            - Pluginin suojaustila lisätty. Vain kaatuminen tai lopetus vie apuprosessiin, lisäviive 32 näytettä sillä kanavalla.
            - Suojatun pluginin kaatuminen mykistää kanavan, ei päästä käsittelemätöntä ääntä läpi, käynnistää pluginin uudelleen ja feidaa äänen takaisin.
            - Pluginin tila otetaan talteen pois audiosäikeeltä.
            - Ilmoitukset lisätty: PLUGIN CRASHED, PLUGIN RESTORED, PLUGIN NOT RESTORED ja PLUGIN PROTECTED.
            - Sessiot pysyvät muodossa 7.

            Tested by automated tests: scan timeouts are not stored as crashes, a failed scan is tried once more before it is blocked, protected mode is chosen only after a crash or a quit, a dead plugin channel outputs silence rather than the dry input, a state snapshot waits a few seconds and does not run on the audio thread, and a session with a protect field still opens.

          # Phrases the engine checklist still looks up in this file.
          # Open session without this plugin
          # does not move to another card
          # MacBook Pro (mic + speakers)
          # Sample rate mismatch: session 48 kHz, audio device 44.1 kHz
          # weak baseline
          # does not renegotiate buses
          # Clicks land on the control that is drawn.
          # this plugin crashed last time
          # including channel 1 slot 1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
